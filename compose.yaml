name: warping-mvp
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: policies
      POSTGRES_USER: policies
      POSTGRES_PASSWORD: local-demo-only
    volumes:
      - policy_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U policies -d policies]
      interval: 2s
      timeout: 3s
      retries: 20
  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://policies:local-demo-only@db:5432/policies
      APP_TODAY: ${APP_TODAY-2026-09-12}
      COMPANY_TIMEZONE: ${COMPANY_TIMEZONE:-America/New_York}
    ports:
      - "127.0.0.1:${API_PORT:-8010}:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 3s
      timeout: 3s
      retries: 20
  web:
    build: ./frontend
    ports:
      - "127.0.0.1:${WEB_PORT:-5180}:80"
    depends_on:
      api:
        condition: service_healthy
volumes:
  policy_data:
